{
  "schema_version": "1.0",
  "preset": {
    "id": "self-test",
    "name": "Self-Test Preset",
    "version": "1.0.0",
    "description": "Overrides all core templates for isolated resolution tests",
    "author": "LANYANT",
    "repository": "https://github.com/ericwang200608-beep/LANYANT-Skills",
    "license": "MIT"
  },
  "requires": {
    "toolkit_version": ">=0.1.0"
  },
  "provides": {
    "templates": [
      {
        "type": "template",
        "name": "spec-template",
        "file": "templates/spec-template.md",
        "description": "Self-test spec template",
        "replaces": "spec-template"
      },
      {
        "type": "template",
        "name": "plan-template",
        "file": "templates/plan-template.md",
        "description": "Self-test plan template",
        "replaces": "plan-template"
      },
      {
        "type": "template",
        "name": "tasks-template",
        "file": "templates/tasks-template.md",
        "description": "Self-test tasks template",
        "replaces": "tasks-template"
      },
      {
        "type": "template",
        "name": "checklist-template",
        "file": "templates/checklist-template.md",
        "description": "Self-test checklist template",
        "replaces": "checklist-template"
      },
      {
        "type": "template",
        "name": "constitution-template",
        "file": "templates/constitution-template.md",
        "description": "Self-test constitution template",
        "replaces": "constitution-template"
      },
      {
        "type": "command",
        "name": "lanyant.specify",
        "file": "commands/lanyant.specify.md",
        "description": "Self-test override of the specify command",
        "replaces": "lanyant.specify"
      },
      {
        "type": "command",
        "name": "lanyant.wrap-test",
        "file": "commands/lanyant.wrap-test.md",
        "description": "Self-test wrap strategy command"
      }
    ]
  },
  "tags": [
    "testing",
    "self-test"
  ]
}
